<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}">
    <title>Campanha - ConectaSocial</title>
</head>
<body>

<div th:replace="~{layout/base :: layout(~{::page})}">
    <main th:fragment="page" class="container py-5">

        <div class="mb-4">
            <a th:href="@{/ong/campanhas}" class="text-decoration-none">
                <i class="fas fa-arrow-left me-2"></i>Voltar para minhas campanhas
            </a>
        </div>

        <div class="card shadow-sm border-0 mx-auto" style="max-width: 750px;">
            <div class="card-body p-4 p-md-5">

                <h2 class="mb-2"
                    th:text="${modoEdicao} ? 'Editar campanha' : 'Criar nova campanha'">
                    Criar nova campanha
                </h2>

                <p class="text-muted mb-4">
                    Compartilhe sua iniciativa e encontre pessoas dispostas a ajudar.
                </p>

                <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

                <form th:action="${modoEdicao} ?
                        @{/ong/campanhas/{id}/editar(id=${campanha.id})} :
                        @{/ong/campanhas}"
                      th:object="${campanha}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título da campanha</label>
                        <input type="text" id="titulo" th:field="*{titulo}"
                               class="form-control" maxlength="150"
                               placeholder="Ex.: Doe alimentos para famílias" required>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea id="descricao" th:field="*{descricao}"
                                  class="form-control" rows="5" maxlength="2000"
                                  placeholder="Conte um pouco sobre sua campanha..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria</label>
                        <select id="categoria" th:field="*{categoria}"
                                class="form-select" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="Ajuda animal">Ajuda animal</option>
                            <option value="Educação">Educação</option>
                            <option value="Alimentação">Alimentação</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Moradia">Moradia</option>
                            <option value="Apoio social">Apoio social</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="local" class="form-label">Localização</label>
                        <input type="text" id="local" th:field="*{local}"
                               class="form-control" maxlength="150"
                               placeholder="Ex.: São Paulo, SP" required>
                    </div>

                    <div class="mb-4">
                        <label for="imagem" class="form-label">Imagem da campanha</label>

                        <input type="file"
                               id="imagem"
                               name="arquivoImagem"
                               class="form-control"
                               accept="image/jpeg,image/png,image/webp">

                        <small class="text-muted">
                            Formatos aceitos: JPG, PNG ou WEBP. Tamanho máximo: 5 MB.
                            <span th:if="${modoEdicao}">
                                Se não selecionar outra imagem, a imagem atual será mantida.
                            </span>
                        </small>

                        <div class="mt-3">
                            <img id="previewImagem"
                                 th:src="${modoEdicao and campanha.temImagem} ?
                                     @{/campanhas/{id}/imagem(id=${campanha.id})} : '#'"
                                 alt="Pré-visualização da imagem"
                                 class="img-fluid rounded"
                                 th:style="${modoEdicao and campanha.temImagem} ?
                                     'display:block; max-height:250px; object-fit:cover;' :
                                     'display:none; max-height:250px; object-fit:cover;'">
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a th:href="@{/ong/campanhas}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas me-2"
                               th:classappend="${modoEdicao} ? 'fa-save' : 'fa-plus'"></i>
                            <span th:text="${modoEdicao} ? 'Salvar alterações' : 'Criar campanha'">
                                Criar campanha
                            </span>
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>
</div>

<script>
    document.getElementById('imagem').addEventListener('change', function(event) {
        const arquivo = event.target.files[0];
        const preview = document.getElementById('previewImagem');

        if (arquivo) {
            preview.src = URL.createObjectURL(arquivo);
            preview.style.display = 'block';
        }
    });
</script>

</body>
</html>
