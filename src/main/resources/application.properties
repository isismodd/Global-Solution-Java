spring.application.name=ConectaSocial

server.port=${PORT:8082}

# Oracle
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:oracle.fiap.com.br}:${DB_PORT:1521}:${DB_SERVICE:orcl}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Security
spring.security.user.name=${SECURITY_USERNAME:}
spring.security.user.password=${SECURITY_PASSWORD:}
spring.security.user.roles=USER

# email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Recuperacaoo de senha
app.base-url=${APP_BASE_URL:http://localhost:8082}
server.forward-headers-strategy=framework

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=5MB

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.response-mime-type=application/json

# JPA / API
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=50

# Swagger
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html

# RabbitMQ - CloudAMQP
spring.rabbitmq.addresses=${RABBITMQ_URL}

# Configurações de tentativas do consumidor
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false