# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy JAR app to Azure Web App: global-solution-java-rm561497'

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Java version
      uses: actions/setup-java@v1
      with:
        java-version: '21'
    
    - name: Build with Maven
      run: mvn clean install -DskipTests
      env: 
        SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
        SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        
        SPRING_MAIL_HOST: smtp.gmail.com
        SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
        SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}

        SECURITY_USERNAME: ${{ secrets.SECURITY_USERNAME }}
        SECURITY_PASSWORD: ${{ secrets.SECURITY_PASSWORD }}

        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        SPRING_RABBITMQ_HOST: ${{ secrets.SPRING_RABBITMQ_HOST }}
        SPRING_RABBITMQ_PORT: 5672
        SPRING_RABBITMQ_USERNAME: ${{ secrets.SPRING_RABBITMQ_USERNAME }}
        SPRING_RABBITMQ_PASSWORD: ${{ secrets.SPRING_RABBITMQ_PASSWORD }}


        APP_BASE_URL: https://global-solution-java-rm561497.azurewebsites.net
        

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with: 
        app-name: 'global-solution-java-rm561497'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_b575e526b61b4ebc922eea7de690da74 }}
        package: '${{ github.workspace }}/target/*.jar'
